<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Noctra Hours wireframe hand</title><desc id="desc">A monochromatic anatomical hand study formed by fine strands drawing progressively from right to left.</desc><style>
.p{fill:none;stroke:#d9dde4;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1400;stroke-dashoffset:1400;opacity:.65;animation:draw 6.2s cubic-bezier(.25,.65,.2,1) forwards}
.f{stroke:#aeb6c3;stroke-width:.65;opacity:.28}.h{stroke:#f1f3f6;stroke-width:1.2;opacity:.78}
.p:nth-child(1){animation-delay:.05s}.p:nth-child(2){animation-delay:.2s}.p:nth-child(3){animation-delay:.35s}.p:nth-child(4){animation-delay:.5s}.p:nth-child(5){animation-delay:.65s}.p:nth-child(6){animation-delay:.8s}.p:nth-child(7){animation-delay:.95s}.p:nth-child(8){animation-delay:1.1s}.p:nth-child(9){animation-delay:1.25s}.p:nth-child(10){animation-delay:1.4s}.p:nth-child(11){animation-delay:1.55s}.p:nth-child(12){animation-delay:1.7s}.p:nth-child(13){animation-delay:1.85s}.p:nth-child(14){animation-delay:2s}.p:nth-child(15){animation-delay:2.15s}.p:nth-child(16){animation-delay:2.3s}.p:nth-child(17){animation-delay:2.45s}.p:nth-child(18){animation-delay:2.6s}.p:nth-child(19){animation-delay:2.75s}.p:nth-child(20){animation-delay:2.9s}.p:nth-child(21){animation-delay:3.05s}.p:nth-child(22){animation-delay:3.2s}.p:nth-child(23){animation-delay:3.35s}.p:nth-child(24){animation-delay:3.5s}.p:nth-child(25){animation-delay:3.65s}.p:nth-child(26){animation-delay:3.8s}.p:nth-child(27){animation-delay:3.95s}.p:nth-child(28){animation-delay:4.1s}
@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.p{stroke-dashoffset:0;animation:none;opacity:.6}}
</style><g>
