<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 125" width="691" height="125" role="img" aria-labelledby="title desc">
<title id="title">MONOLITH reference wind wave field</title>
<desc id="desc">Wave line artwork cropped from the provided MONOLITH reference image, animated with gentle airflow displacement.</desc>
<defs>
  <filter id="wind-displacement" x="-8%" y="-18%" width="116%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.018" numOctaves="1" seed="3">
      <animate attributeName="baseFrequency" values="0.002 0.018;0.0035 0.026;0.002 0.018" dur="18s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" values="2.5;5.5;2.5" dur="18s" repeatCount="indefinite"/>
    </feDisplacementMap>
  </filter>
</defs>
<style>
  .reference-wave { filter:url(#wind-displacement); }
  @media(prefers-reduced-motion:reduce) { .reference-wave { filter:none; } }
</style>
<image class="reference-wave" href="data:image/jpeg;base64," x="0" y="0" width="691" height="125" preserveAspectRatio="none"/>
</svg>